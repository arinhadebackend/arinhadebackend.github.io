<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rinha de Backend</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1a1a;
            --muted: #6b7280;
            --border: #e5e7eb;
            --row-hover: #fafafa;
            --accent: #1a1a1a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f0f10;
                --fg: #f3f4f6;
                --muted: #9ca3af;
                --border: #262629;
                --row-hover: #18181b;
                --accent: #f3f4f6;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: 1040px;
            margin: 0 auto;
            padding: 4rem 1.5rem 6rem;
        }

        header {
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0 0 0.25rem;
            letter-spacing: -0.01em;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        header a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid var(--border);
        }

        header a:hover {
            border-bottom-color: var(--muted);
        }

        .status {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 1rem 0;
        }

        .search {
            width: 100%;
            padding: 0.65rem 0.75rem;
            margin-bottom: 1rem;
            font: inherit;
            font-size: 0.92rem;
            color: var(--fg);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .search::placeholder {
            color: var(--muted);
        }

        .search:focus {
            border-color: var(--muted);
        }

        .empty {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 2rem 0;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        thead th {
            text-align: left;
            font-weight: 500;
            color: var(--muted);
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.75rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        thead th.sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.15s ease;
        }

        thead th.sortable:hover {
            color: var(--fg);
        }

        thead th .arrow {
            display: inline-block;
            width: 0.7em;
            margin-left: 0.25em;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        thead th.num.sortable {
            position: relative;
            padding-right: 1.5rem;
        }

        thead th.num .arrow {
            position: absolute;
            right: 0.5rem;
            margin-left: 0;
        }

        td.num {
            padding-right: 1.5rem;
        }

        thead th.active {
            color: var(--fg);
        }

        thead th.active .arrow {
            opacity: 1;
        }

        tbody td {
            padding: 0.85rem 0.75rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr:hover {
            background: var(--row-hover);
        }

        td.num, th.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        td.rank {
            color: var(--muted);
            width: 2.5rem;
            font-variant-numeric: tabular-nums;
        }

        .id a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.88rem;
        }

        .id span.plain {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.88rem;
        }

        .id a:hover {
            border-bottom-color: var(--accent);
        }

        .issue-sep {
            margin: 0 0.5rem;
            color: var(--border);
            user-select: none;
        }

        .issue-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        .issue-link:hover {
            color: var(--fg);
            border-bottom-color: var(--muted);
        }

        .timestamp {
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .meta-mobile {
            display: none;
            color: var(--muted);
            font-size: 0.78rem;
            margin-top: 0.25rem;
            font-variant-numeric: tabular-nums;
        }

        .meta-mobile .sep {
            margin: 0 0.4rem;
            color: var(--border);
        }

        .meta-mobile .ts {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.72rem;
            margin-top: 0.2rem;
        }

        .meta-mobile .score-mobile {
            display: none;
            font-weight: 600;
            color: var(--fg);
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }

        .score {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        footer {
            margin-top: 2rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        footer .note {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            opacity: 0.7;
        }

        footer .note a {
            color: inherit;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
        }

        footer .note a:hover {
            border-bottom-color: var(--muted);
        }

        .toggle-switch {
            position: relative;
            width: 34px;
            height: 20px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-switch .slider {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .toggle-switch .slider::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 3px;
            width: 14px;
            height: 14px;
            background: var(--bg);
            border-radius: 50%;
            transition: transform 0.2s ease;
        }

        .toggle-switch input:checked + .slider {
            background: var(--muted);
        }

        .toggle-switch input:checked + .slider::before {
            transform: translateX(14px);
        }

        @media (max-width: 720px) {
            main { padding: 2rem 1rem 4rem; }
            .hide-mobile { display: none; }
            thead th, tbody td { padding: 0.7rem 0.5rem; }
            thead th.num, tbody td.num { padding-right: 0.5rem; }
            thead th:last-child, tbody td:last-child { padding-right: 0; }
            thead th:first-child, tbody td:first-child { padding-left: 0; }
            .meta-mobile { display: block; }
            .meta-mobile .score-mobile { display: block; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Rinha de Backend</h1>
            <p>Results preview — <a href="https://github.com/zanfranceschi/rinha-de-backend-2026/" target="_blank" rel="noopener noreferrer">2026 edition</a></p>
        </header>

        <div id="status" class="status">Loading…</div>

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search submissions…"
            autocomplete="off"
            spellcheck="false"
            hidden
        >
        <div id="raw-toggle" style="display:none;text-align:right;margin-bottom:0.75rem;">
            <label style="display:inline-flex;align-items:center;gap:0.5rem;font-size:0.8rem;color:var(--muted);cursor:pointer;user-select:none;">
                <span>show raw values</span>
                <span class="toggle-switch">
                    <input type="checkbox" id="raw-check">
                    <span class="slider"></span>
                </span>
            </label>
        </div>

        <div id="empty" class="empty" hidden>No matches.</div>

        <table id="results" hidden>
            <thead>
                <tr>
                    <th class="num sortable" data-sort="rank">#<span class="arrow"></span></th>
                    <th class="sortable" data-sort="id">Submission<span class="arrow"></span></th>
                    <th class="num sortable hide-mobile" data-sort="p99">p99<span class="arrow"></span></th>
                    <th class="num sortable hide-mobile" data-sort="failure">Failures<span class="arrow"></span></th>
                    <th class="num sortable hide-mobile" data-sort="score">Score<span class="arrow"></span></th>
                    <th class="sortable hide-mobile" data-sort="timestamp">Submitted<span class="arrow"></span></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="show-all-wrap" style="display:none;text-align:center;margin:1rem 0;">
            <button id="show-all-btn" style="
                background:var(--bg);
                color:var(--fg);
                border:1px solid var(--border);
                padding:0.5rem 1.25rem;
                border-radius:6px;
                cursor:pointer;
                font-size:0.85rem;
            "></button>
        </div>

        <footer id="footer" hidden>
            <span id="count"></span>
            <div class="note">
                To remove your submission from the ranking, open a PR at
                <a href="https://github.com/arinhadebackend/arinhadebackend.github.io" target="_blank" rel="noopener noreferrer">arinhadebackend/arinhadebackend.github.io</a>.
            </div>
        </footer>
    </main>

    <script>
        const SOURCE = 'https://raw.githubusercontent.com/arinhadebackend/arinhadebackend.github.io/2026-preview/results-preview.json';

        const fmtScore = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        const fmtTimestamp = (ts) => {
            if (!ts) return '—';
            const d = new Date(ts);
            if (isNaN(d)) return ts;
            return d.toLocaleString('sv-SE', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        };

        const parseNum = (v) => {
            if (v == null || v === '—') return null;
            const n = parseFloat(String(v));
            return isNaN(n) ? null : n;
        };

        const sortKeys = {
            rank:      { get: r => r.rank,                      defaultDir: 'asc',  numeric: true },
            id:        { get: r => r.id.toLowerCase(),          defaultDir: 'asc',  numeric: false },
            p99:       { get: r => parseNum(r.p99),             defaultDir: 'asc',  numeric: true },
            failure:   { get: r => parseNum(r.failure),         defaultDir: 'asc',  numeric: true },
            score:     { get: r => r.score,                     defaultDir: 'desc', numeric: true },
            timestamp: { get: r => r.timestamp ? Date.parse(r.timestamp) : null, defaultDir: 'desc', numeric: true },
        };

        const compareWith = (key, dir) => (a, b) => {
            const av = sortKeys[key].get(a);
            const bv = sortKeys[key].get(b);
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            const cmp = av < bv ? -1 : av > bv ? 1 : 0;
            return dir === 'asc' ? cmp : -cmp;
        };

        async function load() {
            const statusEl = document.getElementById('status');
            const searchEl = document.getElementById('search');
            const emptyEl = document.getElementById('empty');
            const tableEl = document.getElementById('results');
            const tbodyEl = tableEl.querySelector('tbody');
            const theadEl = tableEl.querySelector('thead');
            const footerEl = document.getElementById('footer');
            const countEl = document.getElementById('count');

            try {
                const res = await fetch(SOURCE, { cache: 'no-cache' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                const stripParens = (s) => s.replace(/[()]/g, '');

                const rows = [];
                for (const [participant, submissions] of Object.entries(data)) {
                    for (const [name, info] of Object.entries(submissions)) {
                        const id = `${participant} (${name})`;
                        const repo = info.repo_url ?? null;
                        const issue = info.issue_url ?? null;
                        const raw = info.scoring?.raw ?? null;
                        rows.push({
                            id,
                            p99: info.p99 ?? '—',
                            failure: info.scoring?.failure_rate ?? '—',
                            score: info.scoring?.final_score ?? 0,
                            rawScore: raw?.final_score ?? null,
                            rawP99: raw?.p99_ms ?? null,
                            rawFailure: raw?.failure_rate ?? null,
                            repo,
                            issue,
                            timestamp: info.timestamp ?? null,
                            haystack: `${stripParens(id)} ${repo ?? ''}`.toLowerCase(),
                        });
                    }
                }

                const rankScore = (r) => r.rawScore ?? r.score;
                const rankP99 = (r) => r.rawP99 ?? parseNum(r.p99);

                rows.sort((a, b) => {
                    const sa = rankScore(a), sb = rankScore(b);
                    if (sb !== sa) return sb - sa;
                    const ap = rankP99(a), bp = rankP99(b);
                    if (ap == null && bp == null) return 0;
                    if (ap == null) return 1;
                    if (bp == null) return -1;
                    return ap - bp;
                });
                rows.forEach((r, i, arr) => {
                    if (i === 0) { r.rank = 1; return; }
                    const prev = arr[i - 1];
                    r.rank = (rankScore(r) === rankScore(prev) && rankP99(r) === rankP99(prev))
                        ? prev.rank
                        : prev.rank + 1;
                });

                let sort = { key: 'score', dir: 'desc' };
                let query = '';
                let showRaw = false;
                const VISIBLE_LIMIT = 100;
                let showAll = false;

                const fmtRaw = (n) => n == null ? '—' : n.toLocaleString('en-US', { minimumFractionDigits: 6, maximumFractionDigits: 6 });
                const fmtRawP99 = (n) => n == null ? '—' : n.toLocaleString('en-US', { minimumFractionDigits: 6, maximumFractionDigits: 6 }) + 'ms';
                const fmtRawPct = (n) => n == null ? '—' : (n * 100).toLocaleString('en-US', { minimumFractionDigits: 6, maximumFractionDigits: 6 }) + '%';

                const showAllWrapEl = document.getElementById('show-all-wrap');
                const showAllBtnEl = document.getElementById('show-all-btn');

                const render = () => {
                    const q = stripParens(query).trim().toLowerCase();
                    const filtered = q
                        ? rows.filter(r => r.haystack.includes(q))
                        : rows.slice();

                    filtered.sort(compareWith(sort.key, sort.dir));

                    const truncated = !showAll && filtered.length > VISIBLE_LIMIT;
                    const visible = truncated ? filtered.slice(0, VISIBLE_LIMIT) : filtered;

                    if (filtered.length > VISIBLE_LIMIT) {
                        if (truncated) {
                            const remaining = filtered.length - VISIBLE_LIMIT;
                            showAllBtnEl.textContent = `Show remaining ${remaining} submissions`;
                        } else {
                            showAllBtnEl.textContent = `Show top ${VISIBLE_LIMIT} only`;
                        }
                        showAllWrapEl.style.display = 'block';
                    } else {
                        showAllWrapEl.style.display = 'none';
                    }

                    tbodyEl.innerHTML = visible.map(r => {
                        const idLabel = r.repo
                            ? `<a href="${r.repo}" target="_blank" rel="noopener noreferrer">${r.id}</a>`
                            : `<span class="plain">${r.id}</span>`;
                        const issueLabel = r.issue
                            ? `<span class="issue-sep">·</span><a class="issue-link" href="${r.issue}" target="_blank" rel="noopener noreferrer">details</a>`
                            : '';
                        const p99Val = showRaw ? fmtRawP99(r.rawP99) : r.p99;
                        const failVal = showRaw ? fmtRawPct(r.rawFailure) : r.failure;
                        const scoreVal = showRaw ? fmtRaw(r.rawScore) : fmtScore(r.score);
                        const metaParts = [
                            `p99 ${p99Val}`,
                            `${failVal} fail`,
                        ];
                        const tsLabel = fmtTimestamp(r.timestamp);
                        const metaLine = `
                            <div class="meta-mobile">
                                <div class="score-mobile">${scoreVal}</div>
                                ${metaParts.join('<span class="sep">·</span>')}
                                <div class="ts">${tsLabel}</div>
                            </div>
                        `;
                        return `
                            <tr>
                                <td class="rank num">${r.rank}</td>
                                <td class="id">${idLabel}${issueLabel}${metaLine}</td>
                                <td class="num hide-mobile">${p99Val}</td>
                                <td class="num hide-mobile">${failVal}</td>
                                <td class="num score hide-mobile">${scoreVal}</td>
                                <td class="timestamp hide-mobile">${tsLabel}</td>
                            </tr>
                        `;
                    }).join('');

                    theadEl.querySelectorAll('th.sortable').forEach(th => {
                        const isActive = th.dataset.sort === sort.key;
                        th.classList.toggle('active', isActive);
                        th.querySelector('.arrow').textContent = isActive
                            ? (sort.dir === 'asc' ? '↑' : '↓')
                            : '';
                    });

                    const hasResults = filtered.length > 0;
                    tableEl.hidden = !hasResults;
                    emptyEl.hidden = hasResults;
                    countEl.textContent = q
                        ? `${filtered.length} of ${rows.length} submissions`
                        : `${rows.length} submissions`;
                };

                const rawToggleEl = document.getElementById('raw-toggle');
                const rawCheckEl = document.getElementById('raw-check');

                statusEl.hidden = true;
                searchEl.hidden = false;
                rawToggleEl.style.display = 'block';
                footerEl.hidden = false;

                searchEl.addEventListener('input', (e) => {
                    query = e.target.value;
                    showAll = false;
                    render();
                });

                showAllBtnEl.addEventListener('click', () => {
                    showAll = !showAll;
                    render();
                });

                rawCheckEl.addEventListener('change', () => {
                    showRaw = rawCheckEl.checked;
                    render();
                });

                theadEl.addEventListener('click', (e) => {
                    const th = e.target.closest('th.sortable');
                    if (!th) return;
                    const key = th.dataset.sort;
                    if (sort.key === key) {
                        sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
                    } else {
                        sort.key = key;
                        sort.dir = sortKeys[key].defaultDir;
                    }
                    render();
                });

                render();
            } catch (err) {
                statusEl.textContent = `Could not load results (${err.message}).`;
            }
        }

        load();
    </script>
</body>
</html>
