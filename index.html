<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rinha de Backend — Final Results</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a1a1a;
            --muted: #6b7280;
            --border: #e5e7eb;
            --row-hover: #fafafa;
            --accent: #1a1a1a;
            --ok: #15803d;
            --ok-bg: #f0fdf4;
            --err: #b91c1c;
            --err-bg: #fef2f2;
            --chip-bg: #f4f4f5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f0f10;
                --fg: #f3f4f6;
                --muted: #9ca3af;
                --border: #262629;
                --row-hover: #18181b;
                --accent: #f3f4f6;
                --ok: #4ade80;
                --ok-bg: #14271a;
                --err: #f87171;
                --err-bg: #2a1414;
                --chip-bg: #1c1c1f;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: 1240px;
            margin: 0 auto;
            padding: 4rem 1.5rem 6rem;
        }

        header {
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0 0 0.25rem;
            letter-spacing: -0.01em;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        header a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid var(--border);
        }

        header a:hover {
            border-bottom-color: var(--muted);
        }

        header .nav {
            margin-top: 0.6rem;
            font-size: 0.85rem;
        }

        header .nav span {
            color: var(--fg);
        }

        .status {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 1rem 0;
        }

        .search {
            width: 100%;
            padding: 0.65rem 0.75rem;
            margin-bottom: 1rem;
            font: inherit;
            font-size: 0.92rem;
            color: var(--fg);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .search::placeholder {
            color: var(--muted);
        }

        .search:focus {
            border-color: var(--muted);
        }

        .empty {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 2rem 0;
            text-align: center;
        }

        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        thead th {
            text-align: left;
            font-weight: 500;
            color: var(--muted);
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.75rem 0.75rem;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        thead th.sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.15s ease;
        }

        thead th.sortable:hover {
            color: var(--fg);
        }

        thead th .arrow {
            display: inline-block;
            width: 0.7em;
            margin-left: 0.25em;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        thead th.num.sortable {
            position: relative;
            padding-right: 1.5rem;
        }

        thead th.num .arrow {
            position: absolute;
            right: 0.5rem;
            margin-left: 0;
        }

        td.num {
            padding-right: 1.5rem;
        }

        thead th.active {
            color: var(--fg);
        }

        thead th.active .arrow {
            opacity: 1;
        }

        tbody td {
            padding: 0.85rem 0.75rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr.row:hover {
            background: var(--row-hover);
        }

        td.num, th.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        td.rank {
            color: var(--muted);
            width: 2.5rem;
            font-variant-numeric: tabular-nums;
        }

        .id a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.88rem;
        }

        .avatar {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            vertical-align: -3px;
            margin-right: 0.45rem;
            opacity: 0.85;
            background: var(--row-hover);
        }

        .id span.plain {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.88rem;
        }

        .id a:hover {
            border-bottom-color: var(--accent);
        }

        .stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            max-width: 16rem;
        }

        .chip {
            display: inline-block;
            padding: 0.1rem 0.45rem;
            background: var(--chip-bg);
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            white-space: nowrap;
        }

        .otw-pill {
            margin-left: 0.5rem;
            font-size: 0.65rem;
            color: var(--ok);
            border: 1px solid var(--ok);
            border-radius: 10px;
            padding: 0.05rem 0.4rem;
            white-space: nowrap;
            vertical-align: 1px;
        }

        .dash {
            color: var(--border);
        }

        .err-cell {
            text-align: right;
        }

        .err-badge {
            display: inline-block;
            padding: 0.1rem 0.45rem;
            background: var(--err-bg);
            color: var(--err);
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            user-select: none;
            border: none;
            font: inherit;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .err-badge:hover {
            text-decoration: underline;
        }

        tr.error-detail td {
            padding: 0;
            border-bottom: 1px solid var(--border);
        }

        tr.error-detail pre {
            margin: 0;
            padding: 0.85rem 0.75rem;
            background: var(--err-bg);
            color: var(--err);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.45;
        }

        .score {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .meta-mobile {
            display: none;
            color: var(--muted);
            font-size: 0.78rem;
            margin-top: 0.4rem;
        }

        .meta-mobile .score-mobile {
            display: none;
            font-weight: 600;
            color: var(--fg);
            font-size: 0.95rem;
            padding-top: 0.4rem;
        }

        .meta-mobile .line {
            margin-top: 0.25rem;
            font-variant-numeric: tabular-nums;
        }

        .meta-mobile .sep {
            margin: 0 0.4rem;
            color: var(--border);
        }

        .meta-mobile .stack {
            margin-top: 0.4rem;
        }

        footer {
            margin-top: 2rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        footer .note {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            opacity: 0.7;
        }

        footer .note a {
            color: inherit;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
        }

        footer .note a:hover {
            border-bottom-color: var(--muted);
        }

        @media (max-width: 860px) {
            main { padding: 2rem 1rem 4rem; }
            .hide-mobile { display: none; }
            thead th, tbody td { padding: 0.7rem 0.5rem; }
            thead th.num, tbody td.num { padding-right: 0.5rem; }
            thead th:last-child, tbody td:last-child { padding-right: 0; }
            thead th:first-child, tbody td:first-child { padding-left: 0; }
            .meta-mobile { display: block; }
            .meta-mobile .score-mobile { display: block; }
            tr.error-detail pre {
                padding: 0.7rem 0.5rem;
                max-width: calc(100vw - 2rem);
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Rinha de Backend</h1>
            <p>Final results — <a href="https://github.com/zanfranceschi/rinha-de-backend-2026/" target="_blank" rel="noopener noreferrer">2026 edition</a></p>
            <p class="nav"><span>Final results</span> · <a href="./preview.html">Preview →</a></p>
        </header>

        <div id="status" class="status">Loading…</div>

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search submissions…"
            autocomplete="off"
            spellcheck="false"
            hidden
        >
        <div id="empty" class="empty" hidden>No matches.</div>

        <div class="table-wrap">
            <table id="results" hidden>
                <thead>
                    <tr>
                        <th class="num sortable" data-sort="rank">#<span class="arrow"></span></th>
                        <th class="sortable" data-sort="id">Submission<span class="arrow"></span></th>
                        <th class="sortable hide-mobile" data-sort="stack">Stack<span class="arrow"></span></th>
                        <th class="num sortable hide-mobile" data-sort="p99">p99<span class="arrow"></span></th>
                        <th class="num sortable hide-mobile" data-sort="failure">Failures<span class="arrow"></span></th>
                        <th class="num sortable hide-mobile" data-sort="score">Score<span class="arrow"></span></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="show-all-wrap" style="display:none;text-align:center;margin:1rem 0;">
            <button id="show-all-btn" style="
                background:var(--bg);
                color:var(--fg);
                border:1px solid var(--border);
                padding:0.5rem 1.25rem;
                border-radius:6px;
                cursor:pointer;
                font-size:0.85rem;
            "></button>
        </div>

        <footer id="footer" hidden>
            <span id="count"></span>
        </footer>
    </main>

    <script>
        const SOURCE = './final-results-2026.json';

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));

        const fmtScore = (n) => n == null
            ? '—'
            : n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

        const fmtP99 = (n) => n == null
            ? '—'
            : n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 4 }) + 'ms';

        const fmtPct = (n) => n == null
            ? '—'
            : (n * 100).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 4 }) + '%';

        const sortKeys = {
            rank:      { get: r => r.rank,                                  defaultDir: 'asc',  numeric: true },
            id:        { get: r => r.id.toLowerCase(),                      defaultDir: 'asc',  numeric: false },
            stack:     { get: r => r.stackStr || null,                      defaultDir: 'asc',  numeric: false },
            p99:       { get: r => r.p99,                                   defaultDir: 'asc',  numeric: true },
            failure:   { get: r => r.failureRate,                           defaultDir: 'asc',  numeric: true },
            score:     { get: r => r.score,                                 defaultDir: 'desc', numeric: true },
        };

        // Errored rows (no score) always sink to the bottom regardless of sort.
        const compareWith = (key, dir) => (a, b) => {
            if (a.errored !== b.errored) return a.errored ? 1 : -1;
            const av = sortKeys[key].get(a);
            const bv = sortKeys[key].get(b);
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            const cmp = av < bv ? -1 : av > bv ? 1 : 0;
            return dir === 'asc' ? cmp : -cmp;
        };

        async function load() {
            const statusEl = document.getElementById('status');
            const searchEl = document.getElementById('search');
            const emptyEl = document.getElementById('empty');
            const tableEl = document.getElementById('results');
            const tbodyEl = tableEl.querySelector('tbody');
            const theadEl = tableEl.querySelector('thead');
            const footerEl = document.getElementById('footer');
            const countEl = document.getElementById('count');

            try {
                const res = await fetch(SOURCE, { cache: 'no-cache' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                const rows = data.map((r, i) => {
                    const info = (r.info && !Array.isArray(r.info)) ? r.info : {};
                    const results = (r.results && typeof r.results === 'object') ? r.results : null;
                    const scoring = (results && results.scoring) ? results.scoring : null;

                    const stack = Array.isArray(info.stack) ? info.stack.filter(Boolean) : [];
                    const score = scoring ? scoring.final_score ?? null : null;
                    const p99 = results ? results.p99 ?? null : null;
                    const failureRate = scoring ? scoring.failure_rate ?? null : null;
                    const error = r.error ?? null;

                    const id = r.id ?? r.participant ?? `#${i}`;
                    const repo = r['repo-url'] ?? null;

                    return {
                        idx: i,
                        id,
                        participant: r.participant ?? id,
                        repo,
                        stack,
                        stackStr: stack.join(' '),
                        openToWork: info.open_to_work === true,
                        score,
                        p99,
                        failureRate,
                        error,
                        errored: !results,
                        haystack: `${id} ${repo ?? ''} ${stack.join(' ')}`.toLowerCase(),
                    };
                });

                // Rank: scored rows by score desc, then p99 asc. Errored rows get no rank.
                const scored = rows.filter(r => !r.errored);
                scored.sort((a, b) => {
                    if (b.score !== a.score) return (b.score ?? -Infinity) - (a.score ?? -Infinity);
                    const ap = a.p99, bp = b.p99;
                    if (ap == null && bp == null) return 0;
                    if (ap == null) return 1;
                    if (bp == null) return -1;
                    return ap - bp;
                });
                scored.forEach((r, i, arr) => {
                    if (i === 0) { r.rank = 1; return; }
                    const prev = arr[i - 1];
                    r.rank = (r.score === prev.score && r.p99 === prev.p99) ? prev.rank : prev.rank + 1;
                });
                const errored = rows.filter(r => r.errored);
                errored.forEach(r => { r.rank = null; });
                // Reorder so default view (and tie order) follows the ranking, errored last.
                rows.length = 0;
                rows.push(...scored, ...errored);

                let sort = { key: 'score', dir: 'desc' };
                let query = '';
                const VISIBLE_LIMIT = 100;
                let showAll = false;
                const expanded = new Set();

                const showAllWrapEl = document.getElementById('show-all-wrap');
                const showAllBtnEl = document.getElementById('show-all-btn');

                const renderStack = (stack) => stack.length
                    ? `<div class="stack">${stack.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>`
                    : '<span class="dash">—</span>';

                const otwBadge = '<span class="otw-pill">open to work</span>';

                const errKind = (err) => String(err).trim().toLowerCase().startsWith('submission rejected')
                    ? 'rejected'
                    : 'failed';

                const renderErrBadge = (r) => r.error
                    ? `<button class="err-badge" data-err="${r.idx}">${expanded.has(r.idx) ? 'hide' : errKind(r.error)}</button>`
                    : '<span class="dash">—</span>';

                const render = () => {
                    const q = query.trim().toLowerCase();
                    const filtered = q ? rows.filter(r => r.haystack.includes(q)) : rows.slice();

                    filtered.sort(compareWith(sort.key, sort.dir));

                    const truncated = !showAll && filtered.length > VISIBLE_LIMIT;
                    const visible = truncated ? filtered.slice(0, VISIBLE_LIMIT) : filtered;

                    if (filtered.length > VISIBLE_LIMIT) {
                        if (truncated) {
                            const remaining = filtered.length - VISIBLE_LIMIT;
                            showAllBtnEl.textContent = `Show remaining ${remaining} submissions`;
                        } else {
                            showAllBtnEl.textContent = `Show top ${VISIBLE_LIMIT} only`;
                        }
                        showAllWrapEl.style.display = 'block';
                    } else {
                        showAllWrapEl.style.display = 'none';
                    }

                    tbodyEl.innerHTML = visible.map(r => {
                        const avatar = `<img class="avatar" loading="lazy" decoding="async" alt="" src="https://github.com/${encodeURIComponent(r.participant)}.png?size=40" onerror="this.style.visibility='hidden'">`;
                        const otw = r.openToWork ? otwBadge : '';
                        const idLabel = r.repo
                            ? `${avatar}<a href="${esc(r.repo)}" target="_blank" rel="noopener noreferrer">${esc(r.id)}</a>${otw}`
                            : `${avatar}<span class="plain">${esc(r.id)}</span>${otw}`;

                        const rankLabel = r.rank == null ? '<span class="dash">—</span>' : r.rank;
                        const p99Val = fmtP99(r.p99);
                        const failVal = fmtPct(r.failureRate);
                        const scoreVal = fmtScore(r.score);

                        const metaBits = [];
                        if (!r.errored) {
                            metaBits.push(`p99 ${p99Val}`, `${failVal} fail`);
                        }
                        const mobileScore = r.errored
                            ? `<span style="color:var(--err)">${r.error ? errKind(r.error) : 'no result'}</span>`
                            : scoreVal;
                        const metaLine = `
                            <div class="meta-mobile">
                                <div class="score-mobile">${mobileScore}</div>
                                ${metaBits.length ? `<div class="line">${metaBits.join('<span class="sep">·</span>')}</div>` : ''}
                                ${r.stack.length ? renderStack(r.stack) : ''}
                                ${r.error ? `<div class="line">${renderErrBadge(r)}</div>` : ''}
                            </div>
                        `;

                        const metricCells = r.errored
                            ? `<td class="hide-mobile err-cell" colspan="3">${renderErrBadge(r)}</td>`
                            : `<td class="num hide-mobile">${p99Val}</td>
                                <td class="num hide-mobile">${failVal}</td>
                                <td class="num score hide-mobile">${scoreVal}</td>`;

                        const mainRow = `
                            <tr class="row">
                                <td class="rank num">${rankLabel}</td>
                                <td class="id">${idLabel}${metaLine}</td>
                                <td class="hide-mobile">${renderStack(r.stack)}</td>
                                ${metricCells}
                            </tr>
                        `;

                        const detailRow = (r.error && expanded.has(r.idx))
                            ? `<tr class="error-detail"><td colspan="6"><pre>${esc(r.error)}</pre></td></tr>`
                            : '';

                        return mainRow + detailRow;
                    }).join('');

                    theadEl.querySelectorAll('th.sortable').forEach(th => {
                        const isActive = th.dataset.sort === sort.key;
                        th.classList.toggle('active', isActive);
                        th.querySelector('.arrow').textContent = isActive
                            ? (sort.dir === 'asc' ? '↑' : '↓')
                            : '';
                    });

                    const hasResults = filtered.length > 0;
                    tableEl.hidden = !hasResults;
                    emptyEl.hidden = hasResults;
                    countEl.textContent = q
                        ? `${filtered.length} of ${rows.length} submissions`
                        : `${rows.length} submissions`;
                };

                statusEl.hidden = true;
                searchEl.hidden = false;
                footerEl.hidden = false;

                searchEl.addEventListener('input', (e) => {
                    query = e.target.value;
                    showAll = false;
                    render();
                });

                showAllBtnEl.addEventListener('click', () => {
                    showAll = !showAll;
                    render();
                });

                tbodyEl.addEventListener('click', (e) => {
                    const btn = e.target.closest('.err-badge');
                    if (!btn) return;
                    const idx = Number(btn.dataset.err);
                    if (expanded.has(idx)) expanded.delete(idx);
                    else expanded.add(idx);
                    render();
                });

                theadEl.addEventListener('click', (e) => {
                    const th = e.target.closest('th.sortable');
                    if (!th) return;
                    const key = th.dataset.sort;
                    if (sort.key === key) {
                        sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
                    } else {
                        sort.key = key;
                        sort.dir = sortKeys[key].defaultDir;
                    }
                    render();
                });

                render();
            } catch (err) {
                statusEl.textContent = `Could not load results (${err.message}).`;
            }
        }

        load();
    </script>
</body>
</html>
